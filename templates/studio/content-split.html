<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #191919;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 100px 90px 100px 90px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .headline {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    text-align: left;
    margin-bottom: 72px;
    word-break: keep-all;
    max-width: 780px;
  }
  .split {
    display: flex;
    flex: 1;
    gap: 0;
    align-items: stretch;
  }
  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-top: 8px;
  }
  .col-left {
    padding-right: 52px;
  }
  .col-right {
    padding-left: 52px;
  }
  .divider {
    width: 1px;
    background: #D4D4CC;
    flex-shrink: 0;
    align-self: stretch;
  }
  .col-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: {{accent_color}};
    margin-bottom: 28px;
  }
  .col-title {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    word-break: keep-all;
  }
  .col-body {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.6;
    color: #7A7A72;
    word-break: keep-all;
  }
  .subtext {
    margin-top: auto;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.6;
    color: #B8B8B0;
    text-align: left;
    max-width: 640px;
    padding-top: 48px;
    word-break: keep-all;
  }
  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .brand {
    position: absolute;
    bottom: 72px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: {{accent_color}};
  }
  .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="headline">{{headline}}</h1>
    <p class="headline-en">{{headline_en}}</p>
    <div class="split">
      <div class="col col-left">
        <span class="col-label">A</span>
        <h2 class="col-title">{{left_title}}</h2>
        <p class="col-body">{{left_body}}</p>
      </div>
      <div class="divider"></div>
      <div class="col col-right">
        <span class="col-label">B</span>
        <h2 class="col-title">{{right_title}}</h2>
        <p class="col-body">{{right_body}}</p>
      </div>
    </div>
    <p class="subtext">{{subtext}}</p>
  </div>
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">{{account_name}}</span>
  </div>
</body>
</html>
