<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #191919;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 80px 90px 100px 90px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .image-frame {
    width: 100%;
    height: 680px;
    border: 1px solid #D4D4CC;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background: #EEEDEA;
  }
  .image-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .image-placeholder::before,
  .image-placeholder::after {
    content: '';
    position: absolute;
    background: #D4D4CC;
  }
  .image-placeholder::before {
    width: 141%;
    height: 1px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(25deg);
  }
  .image-placeholder::after {
    width: 141%;
    height: 1px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
  }
  .image-placeholder span {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #B8B8B0;
    background: #EEEDEA;
    padding: 8px 20px;
    position: relative;
    z-index: 1;
  }
  .text-area {
    padding-top: 52px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .headline {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    text-align: left;
    margin-bottom: 28px;
    word-break: keep-all;
    max-width: 780px;
  }
  .body {
    font-size: 26px;
    font-weight: 400;
    line-height: 1.6;
    color: #7A7A72;
    text-align: left;
    max-width: 720px;
    word-break: keep-all;
  }
  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .brand {
    position: absolute;
    bottom: 72px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: {{accent_color}};
  }
  .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="image-frame">
      <!--
        When {{image_url}} is provided, replace the placeholder div below with:
        <img src="{{image_url}}" alt="">
      -->
      <div class="image-placeholder">
        <span>IMAGE</span>
      </div>
    </div>
    <div class="text-area">
      <h1 class="headline">{{headline}}</h1>
      <p class="headline-en">{{headline_en}}</p>
      <p class="body">{{body}}</p>
    </div>
  </div>
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">{{account_name}}</span>
  </div>
</body>
</html>
