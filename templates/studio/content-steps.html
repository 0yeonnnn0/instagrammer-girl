<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #191919;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 100px 90px 100px 90px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .headline {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    text-align: left;
    margin-bottom: 80px;
    word-break: keep-all;
    max-width: 780px;
  }
  .steps-container {
    display: flex;
    flex-direction: row;
    flex: 1;
  }
  .steps-line {
    width: 2px;
    background: {{accent_color}};
    margin-right: 48px;
    margin-top: 8px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .steps {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0;
    flex: 1;
  }
  .step {
    padding: 36px 0;
    border-bottom: 1px solid #E2E2DC;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step:first-child {
    padding-top: 0;
  }
  .step:last-child {
    border-bottom: none;
  }
  .step-number {
    font-size: 60px;
    font-weight: 200;
    color: {{accent_color}};
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .step-text {
    font-size: 38px;
    font-weight: 500;
    line-height: 1.35;
    color: #191919;
    word-break: keep-all;
    max-width: 720px;
  }
  .body {
    margin-top: auto;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.6;
    color: #7A7A72;
    text-align: left;
    max-width: 640px;
    word-break: keep-all;
    padding-top: 48px;
  }
  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .brand {
    position: absolute;
    bottom: 72px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: {{accent_color}};
  }
  .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="headline">{{headline}}</h1>
    <p class="headline-en">{{headline_en}}</p>
    <div class="steps-container">
      <div class="steps-line"></div>
      <div class="steps">
        <div class="step">
          <span class="step-number">01</span>
          <span class="step-text">{{step1}}</span>
        </div>
        <div class="step">
          <span class="step-number">02</span>
          <span class="step-text">{{step2}}</span>
        </div>
        <div class="step">
          <span class="step-number">03</span>
          <span class="step-text">{{step3}}</span>
        </div>
      </div>
    </div>
    <p class="body">{{body}}</p>
  </div>
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">{{account_name}}</span>
  </div>
</body>
</html>
