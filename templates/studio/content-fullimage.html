<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #191919;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #FFFFFF;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    z-index: 3;
  }
  .bg-image {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .bg-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .bg-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.15) 0%,
      rgba(0, 0, 0, 0.08) 30%,
      rgba(0, 0, 0, 0.35) 55%,
      rgba(0, 0, 0, 0.78) 100%
    );
  }
  .brand-top {
    position: absolute;
    top: 64px;
    left: 90px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-top .brand-dot {
    width: 10px;
    height: 10px;
    background: {{accent_color}};
  }
  .brand-top .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.02em;
  }
  .content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: 0 90px 88px 90px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    margin-bottom: 32px;
  }
  .headline {
    font-size: 60px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.03em;
    text-align: left;
    margin-bottom: 36px;
    word-break: keep-all;
    max-width: 820px;
    color: #FFFFFF;
  }
  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .sections {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .section {
    padding: 20px 0;
  }
  .section:first-child {
    padding-top: 0;
  }
  .section-divider {
    width: 40px;
    height: 1px;
    background: rgba(255, 255, 255, 0.25);
    margin: 4px 0;
  }
  .section-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: {{accent_color}};
    margin-bottom: 10px;
    display: block;
  }
  .section-body {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.75);
    word-break: keep-all;
    max-width: 720px;
  }
</style>
</head>
<body>
  <div class="bg-image">
    <!--
      Replace src with {{image_url}} when available.
      Fallback: solid dark background shown by body bg color.
    -->
    <img src="{{image_url}}" alt="">
  </div>
  <div class="bg-overlay"></div>

  <div class="brand-top">
    <div class="brand-dot"></div>
    <span class="brand-name">{{account_name}}</span>
  </div>

  <div class="content">
    <span class="badge">{{badge_text}}</span>
    <h1 class="headline">{{headline}}</h1>
    <p class="headline-en">{{headline_en}}</p>
    <div class="sections">
      <div class="section">
        <p class="section-body">{{body}}</p>
      </div>
      <div class="section-divider"></div>
      <div class="section">
        <span class="section-badge">{{badge2_text}}</span>
        <p class="section-body">{{body2}}</p>
      </div>
    </div>
  </div>
</body>
</html>
