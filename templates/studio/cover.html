<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
    color: #191919;
    position: relative;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .accent-line {
    position: absolute;
    left: 80px;
    top: 420px;
    width: 2px;
    height: 120px;
    background: {{accent_color}};
  }

  .accent-circle {
    position: absolute;
    top: -40px;
    right: 60px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: {{accent_color}};
    opacity: 0.05;
  }

  .content {
    position: absolute;
    left: 120px;
    right: 160px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .label {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7A7A72;
    margin-bottom: 28px;
  }

  .headline {
    font-size: 116px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #191919;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }

  .brand {
    position: absolute;
    bottom: 72px;
    left: 120px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: {{accent_color}};
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 400;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div class="accent-line"></div>
  <div class="accent-circle"></div>

  <div class="content">
    <p class="label">{{subtext}}</p>
    <h1 class="headline">{{headline}}</h1>
    <p class="headline-en">{{headline_en}}</p>
  </div>

  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">{{account_name}}</span>
  </div>

</body>
</html>
