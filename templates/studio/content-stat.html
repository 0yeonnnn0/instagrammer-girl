<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
    color: #191919;
    position: relative;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .content {
    position: absolute;
    left: 120px;
    right: 160px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .label {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7A7A72;
    margin-bottom: 64px;
  }

  .stat-area {
    margin-left: -12px;
  }

  .emphasis {
    font-size: 180px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.04em;
    color: {{accent_color}};
  }

  .stat-underline {
    width: 160px;
    height: 1px;
    background: {{accent_color}};
    margin-top: 20px;
    margin-bottom: 56px;
  }

  .body {
    font-size: 36px;
    font-weight: 400;
    line-height: 1.7;
    color: #191919;
    word-break: keep-all;
    overflow-wrap: break-word;
    max-width: 640px;
  }

  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }

  .emphasis-en {
    font-size: 24px;
    font-weight: 300;
    color: #B8B8B0;
    margin-top: 4px;
  }

  .brand {
    position: absolute;
    bottom: 72px;
    left: 120px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: {{accent_color}};
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 400;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

  <div class="content">
    <p class="label">{{headline}}</p>
    <p class="headline-en">{{headline_en}}</p>
    <div class="stat-area">
      <p class="emphasis">{{emphasis}}</p>
      <p class="emphasis-en">{{emphasis_en}}</p>
      <div class="stat-underline"></div>
    </div>
    <p class="body">{{body}}</p>
  </div>

  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">{{account_name}}</span>
  </div>

</body>
</html>
