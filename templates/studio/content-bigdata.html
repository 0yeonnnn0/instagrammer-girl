<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #191919;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 100px 90px 100px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .headline {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7A7A72;
    margin-bottom: 64px;
  }
  .data-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
  }
  .bigdata-number {
    font-size: 240px;
    font-weight: 100;
    line-height: 0.85;
    letter-spacing: -0.04em;
    color: {{accent_color}};
  }
  .bigdata-unit {
    font-size: 48px;
    font-weight: 500;
    line-height: 1;
    color: #191919;
    letter-spacing: -0.02em;
    align-self: baseline;
    padding-bottom: 16px;
  }
  .accent-line {
    width: 80px;
    height: 1px;
    background: {{accent_color}};
    margin-top: 32px;
    margin-bottom: 48px;
  }
  .body {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.6;
    color: #191919;
    text-align: left;
    max-width: 720px;
    margin-bottom: 24px;
    word-break: keep-all;
  }
  .subtext {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.6;
    color: #B8B8B0;
    text-align: left;
    max-width: 640px;
    word-break: keep-all;
  }
  .headline-en {
    font-size: 28px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 8px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .emphasis-en {
    font-size: 24px;
    font-weight: 300;
    color: #B8B8B0;
    margin-top: 4px;
  }
  .brand {
    position: absolute;
    bottom: 72px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: {{accent_color}};
  }
  .brand-name {
    font-size: 16px;
    font-weight: 500;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="page">
    <span class="headline">{{headline}}</span>
    <p class="headline-en">{{headline_en}}</p>
    <div class="data-row">
      <span class="bigdata-number">{{bigdata_number}}</span>
      <span class="bigdata-unit">{{bigdata_unit}}</span>
    </div>
    <p class="emphasis-en">{{emphasis_en}}</p>
    <div class="accent-line"></div>
    <p class="body">{{body}}</p>
    <p class="subtext">{{subtext}}</p>
  </div>
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">{{account_name}}</span>
  </div>
</body>
</html>
