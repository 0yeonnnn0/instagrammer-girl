<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F0F0F0;
      font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 300px 80px 450px;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .headline {
      font-size: 64px;
      font-weight: 800;
      color: #1A1A1A;
      text-align: center;
      line-height: 1.3;
      word-break: keep-all;
      margin-bottom: 56px;
    }

    .highlight {
      background: linear-gradient(to top, {{accent_color}}66 45%, transparent 45%);
      color: #1A1A1A;
      padding: 0 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 820px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 24px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 28px 36px;
    }

    .item-num {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: {{accent_color}};
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-text {
      font-size: 38px;
      font-weight: 600;
      color: #374151;
      line-height: 1.4;
      word-break: keep-all;
    }

    .scene-indicator {
      position: absolute;
      top: 280px;
      right: 80px;
      font-size: 26px;
      font-weight: 600;
      color: #D1D5DB;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <h2 class="headline">{{headline}}</h2>
    <div class="list">
      <div class="list-item">
        <div class="item-num">1</div>
        <span class="item-text">{{item1}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">2</div>
        <span class="item-text">{{item2}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">3</div>
        <span class="item-text">{{item3}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">4</div>
        <span class="item-text">{{item4}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">5</div>
        <span class="item-text">{{item5}}</span>
      </div>
    </div>
  </div>
</body>
</html>
