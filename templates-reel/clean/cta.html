<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel CTA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F0F0F0;
      font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 300px 80px 450px;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .headline {
      font-size: 80px;
      font-weight: 900;
      color: #1A1A1A;
      text-align: center;
      line-height: 1.3;
      word-break: keep-all;
      margin-bottom: 24px;
    }

    .highlight {
      background: linear-gradient(to top, {{accent_color}}66 45%, transparent 45%);
      color: #1A1A1A;
      padding: 0 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .subtext {
      font-size: 38px;
      font-weight: 400;
      color: #9CA3AF;
      text-align: center;
      margin-bottom: 56px;
      word-break: keep-all;
    }

    .cta-button {
      background: {{accent_color}};
      color: #FFFFFF;
      font-size: 44px;
      font-weight: 700;
      padding: 22px 72px;
      border-radius: 60px;
      border: none;
      display: inline-block;
      font-family: inherit;
      margin-bottom: 40px;
    }

    .tag-row {
      display: flex;
      gap: 16px;
    }

    .tag {
      font-size: 30px;
      font-weight: 400;
      color: #9CA3AF;
    }

    .brand {
      position: absolute;
      bottom: 440px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: {{accent_color}};
    }

    .brand-name {
      font-size: 28px;
      font-weight: 600;
      color: #BFBFBF;
    }
  </style>
</head>
<body>
  <div class="content">
    <h2 class="headline">{{headline}}</h2>
    <p class="subtext">{{subtext}}</p>
    <button class="cta-button">{{cta_text}}</button>
    <div class="tag-row">
      <span class="tag">{{tag1}}</span>
      <span class="tag">{{tag2}}</span>
      <span class="tag">{{tag3}}</span>
    </div>
  </div>
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">{{account_name}}</span>
  </div>
</body>
</html>
