<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Comparison</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F0F0F0;
      font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 300px 80px 450px;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .headline {
      font-size: 64px;
      font-weight: 800;
      color: #1A1A1A;
      text-align: center;
      line-height: 1.3;
      word-break: keep-all;
      margin-bottom: 56px;
    }

    .highlight {
      background: linear-gradient(to top, {{accent_color}}66 45%, transparent 45%);
      color: #1A1A1A;
      padding: 0 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .compare-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 860px;
    }

    .compare-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .compare-card.negative {
      border-left: 6px solid #EF4444;
    }

    .compare-card.positive {
      border-left: 6px solid {{accent_color}};
    }

    .compare-label {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .compare-card.negative .compare-label {
      color: #EF4444;
    }

    .compare-card.positive .compare-label {
      color: {{accent_color}};
    }

    .compare-title {
      font-size: 48px;
      font-weight: 800;
      color: #1A1A1A;
      word-break: keep-all;
    }

    .compare-body {
      font-size: 36px;
      font-weight: 400;
      color: #6B7280;
      line-height: 1.5;
      word-break: keep-all;
    }

    .vs-badge {
      align-self: center;
      background: #1A1A1A;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-indicator {
      position: absolute;
      top: 280px;
      right: 80px;
      font-size: 26px;
      font-weight: 600;
      color: #D1D5DB;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <h2 class="headline">{{headline}}</h2>
    <div class="compare-grid">
      <div class="compare-card negative">
        <div class="compare-label">BEFORE</div>
        <div class="compare-title">{{left_title}}</div>
        <div class="compare-body">{{left_body}}</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="compare-card positive">
        <div class="compare-label">AFTER</div>
        <div class="compare-title">{{right_title}}</div>
        <div class="compare-body">{{right_body}}</div>
      </div>
    </div>
  </div>
</body>
</html>
