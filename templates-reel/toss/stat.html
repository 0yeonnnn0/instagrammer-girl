<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #191F28;
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .label {
      font-size: 32px; font-weight: 500; color: #4E5968;
      letter-spacing: 0.05em; margin-bottom: 40px;
    }
    .stat-number {
      font-size: 180px; font-weight: 800; color: {{accent_color}};
      line-height: 1; letter-spacing: -0.05em; margin-bottom: 8px;
    }
    .stat-unit {
      font-size: 48px; font-weight: 600; color: {{accent_color}};
      opacity: 0.6; margin-bottom: 48px;
    }
    .divider { width: 40px; height: 3px; background: #333D4B; margin-bottom: 40px; }
    .body-text {
      font-size: 38px; font-weight: 400; color: #8B95A1;
      text-align: center; line-height: 1.7; word-break: keep-all; max-width: 760px;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 100px;
      font-size: 24px; font-weight: 500; color: #333D4B;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="label">{{headline}}</div>
    <div class="stat-number">{{emphasis}}</div>
    <div class="stat-unit">{{subtext}}</div>
    <div class="divider"></div>
    <p class="body-text">{{body}}</p>
  </div>
</body>
</html>
