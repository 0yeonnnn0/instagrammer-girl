<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #191F28;
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .icon { font-size: 64px; margin-bottom: 32px; }
    .tip-badge {
      display: inline-block; background: {{accent_color}}1A; color: {{accent_color}};
      font-size: 28px; font-weight: 600; padding: 8px 24px; border-radius: 8px;
      margin-bottom: 36px;
    }
    .headline {
      font-size: 68px; font-weight: 700; color: #FFFFFF; text-align: center;
      line-height: 1.35; word-break: keep-all; margin-bottom: 36px;
    }
    .tip-card {
      background: #1E2632; border-radius: 20px; padding: 36px 40px;
      width: 100%; max-width: 820px; border-left: 4px solid {{accent_color}};
    }
    .tip-text {
      font-size: 36px; font-weight: 400; color: #8B95A1; line-height: 1.7;
      word-break: keep-all;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 100px;
      font-size: 24px; font-weight: 500; color: #333D4B;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="icon">{{badge_text}}</div>
    <div class="tip-badge">TIP</div>
    <h2 class="headline">{{headline}}</h2>
    <div class="tip-card"><p class="tip-text">{{body}}</p></div>
  </div>
</body>
</html>
