<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #191F28;
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 300px 100px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .headline {
      font-size: 56px; font-weight: 700; color: #FFFFFF; line-height: 1.35;
      word-break: keep-all; margin-bottom: 48px;
    }
    .list { display: flex; flex-direction: column; gap: 20px; width: 100%; }
    .list-item {
      display: flex; align-items: center; gap: 20px;
      background: #1E2632; border-radius: 16px; padding: 24px 28px;
    }
    .item-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: {{accent_color}}; flex-shrink: 0;
    }
    .item-text {
      font-size: 36px; font-weight: 500; color: #B0B8C1; line-height: 1.4;
      word-break: keep-all;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 100px;
      font-size: 24px; font-weight: 500; color: #333D4B;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <h2 class="headline">{{headline}}</h2>
    <div class="list">
      <div class="list-item"><div class="item-dot"></div><span class="item-text">{{item1}}</span></div>
      <div class="list-item"><div class="item-dot"></div><span class="item-text">{{item2}}</span></div>
      <div class="list-item"><div class="item-dot"></div><span class="item-text">{{item3}}</span></div>
      <div class="list-item"><div class="item-dot"></div><span class="item-text">{{item4}}</span></div>
      <div class="list-item"><div class="item-dot"></div><span class="item-text">{{item5}}</span></div>
    </div>
  </div>
</body>
</html>
