<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #191F28;
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 300px 100px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .number {
      font-size: 120px; font-weight: 800; color: {{accent_color}}; line-height: 1;
      margin-bottom: 20px; opacity: 0.3;
    }
    .headline {
      font-size: 72px; font-weight: 700; color: #FFFFFF; line-height: 1.35;
      letter-spacing: -0.02em; word-break: keep-all; margin-bottom: 32px;
    }
    .divider {
      width: 40px; height: 3px; background: #333D4B; margin-bottom: 32px;
    }
    .body-text {
      font-size: 38px; font-weight: 400; color: #8B95A1; line-height: 1.7;
      word-break: keep-all;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 100px;
      font-size: 24px; font-weight: 500; color: #333D4B;
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="number">{{badge_number}}</div>
    <h2 class="headline">{{headline}}</h2>
    <div class="divider"></div>
    <p class="body-text">{{body}}</p>
  </div>
</body>
</html>
