<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #F8F7F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif;
    color: #191919;
    position: relative;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .scene-indicator {
    position: absolute;
    top: 280px;
    right: 80px;
    font-size: 18px;
    font-weight: 400;
    color: #B8B8B0;
    letter-spacing: 0.08em;
  }

  .content {
    position: absolute;
    top: 300px;
    left: 100px;
    right: 100px;
    bottom: 450px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .headline {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #191919;
    margin-bottom: 64px;
    word-break: keep-all;
  }

  .headline-en {
    font-size: 30px;
    font-weight: 300;
    color: #B8B8B0;
    letter-spacing: 0.01em;
    margin-top: 12px;
    line-height: 1.4;
    word-break: keep-all;
  }

  .section {
    padding-left: 32px;
    margin-bottom: 0;
  }

  .section-before {
    border-left: 2px solid #C94040;
  }

  .section-after {
    border-left: 2px solid {{accent_color}};
  }

  .section-label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #B8B8B0;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 44px;
    font-weight: 700;
    line-height: 1.2;
    color: #191919;
    margin-bottom: 16px;
    word-break: keep-all;
  }

  .section-body {
    font-size: 32px;
    font-weight: 300;
    line-height: 1.55;
    color: #7A7A72;
    word-break: keep-all;
  }

  .divider {
    position: relative;
    height: 1px;
    background: #E0E0DA;
    margin: 48px 0;
  }

  .divider-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #F8F7F4;
    padding: 0 20px;
    font-size: 22px;
    font-weight: 400;
    color: #B8B8B0;
    letter-spacing: 0.05em;
  }

  .brand {
    position: absolute;
    bottom: 460px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: {{accent_color}};
  }

  .brand-name {
    font-size: 22px;
    font-weight: 500;
    color: #B8B8B0;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>

  <div class="content">
    <div class="headline">{{headline}}</div>
    <p class="headline-en">{{headline_en}}</p>

    <div class="section section-before">
      <div class="section-label">Before</div>
      <div class="section-title">{{left_title}}</div>
      <div class="section-body">{{left_body}}</div>
    </div>

    <div class="divider">
      <span class="divider-text">vs</span>
    </div>

    <div class="section section-after">
      <div class="section-label">After</div>
      <div class="section-title">{{right_title}}</div>
      <div class="section-body">{{right_body}}</div>
    </div>
  </div>

  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-name">{{account_name}}</div>
  </div>
</body>
</html>
