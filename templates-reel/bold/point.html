<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(160deg, #1a0533 0%, #0d1117 40%, #0a192f 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .number {
      font-size: 180px; font-weight: 900; line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, {{accent_color}}, #FF6B6B);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      opacity: 0.25;
    }
    .headline {
      font-size: 76px; font-weight: 800; color: #FFFFFF; text-align: center;
      line-height: 1.3; word-break: keep-all; margin-bottom: 32px;
    }
    .divider {
      width: 80px; height: 4px; margin-bottom: 32px;
      background: linear-gradient(90deg, {{accent_color}}, #FF6B6B);
      border-radius: 2px;
    }
    .body-text {
      font-size: 40px; font-weight: 400; color: rgba(255,255,255,0.55);
      text-align: center; line-height: 1.7; word-break: keep-all; max-width: 780px;
    }
    .glow {
      position: absolute; width: 300px; height: 300px; border-radius: 50%;
      filter: blur(100px); opacity: 0.1; background: {{accent_color}};
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 80px;
      font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="number">{{badge_number}}</div>
    <h2 class="headline">{{headline}}</h2>
    <div class="divider"></div>
    <p class="body-text">{{body}}</p>
  </div>
</body>
</html>
