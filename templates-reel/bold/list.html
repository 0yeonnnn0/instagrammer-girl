<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(160deg, #1a0533 0%, #0d1117 40%, #0a192f 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .headline {
      font-size: 60px; font-weight: 800; color: #FFFFFF; text-align: center;
      line-height: 1.35; word-break: keep-all; margin-bottom: 52px;
    }
    .list { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 840px; }
    .list-item {
      display: flex; align-items: center; gap: 24px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 26px 32px;
      backdrop-filter: blur(10px);
    }
    .item-num {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, {{accent_color}}, #FF6B6B);
      color: #FFFFFF; font-size: 22px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .item-text {
      font-size: 36px; font-weight: 600; color: rgba(255,255,255,0.8);
      line-height: 1.4; word-break: keep-all;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 80px;
      font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <h2 class="headline">{{headline}}</h2>
    <div class="list">
      <div class="list-item"><div class="item-num">1</div><span class="item-text">{{item1}}</span></div>
      <div class="list-item"><div class="item-num">2</div><span class="item-text">{{item2}}</span></div>
      <div class="list-item"><div class="item-num">3</div><span class="item-text">{{item3}}</span></div>
      <div class="list-item"><div class="item-num">4</div><span class="item-text">{{item4}}</span></div>
      <div class="list-item"><div class="item-num">5</div><span class="item-text">{{item5}}</span></div>
    </div>
  </div>
</body>
</html>
