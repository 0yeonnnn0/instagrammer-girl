<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(160deg, #1a0533 0%, #0d1117 40%, #0a192f 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, {{accent_color}}, #FF6B6B);
      color: #FFFFFF;
      font-size: 30px; font-weight: 800; padding: 12px 36px; border-radius: 50px;
      margin-bottom: 48px; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .headline {
      font-size: 92px; font-weight: 900; color: #FFFFFF; text-align: center;
      line-height: 1.3; letter-spacing: -0.03em; word-break: keep-all; margin-bottom: 40px;
      text-shadow: 0 4px 30px rgba(108, 92, 231, 0.3);
    }
    .subtext {
      font-size: 40px; font-weight: 400; color: rgba(255,255,255,0.5); text-align: center;
      line-height: 1.6; word-break: keep-all;
    }
    /* 배경 글로우 효과 */
    .glow {
      position: absolute; width: 400px; height: 400px; border-radius: 50%;
      filter: blur(120px); opacity: 0.15;
    }
    .glow-1 { top: 300px; left: -100px; background: {{accent_color}}; }
    .glow-2 { bottom: 500px; right: -100px; background: #FF6B6B; }
    .brand {
      position: absolute; bottom: 440px;
      display: flex; align-items: center; gap: 10px;
    }
    .brand-name { font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="content">
    <div class="badge">{{badge_text}}</div>
    <h1 class="headline">{{headline}}</h1>
    <p class="subtext">{{subtext}}</p>
  </div>
  <div class="brand"><span class="brand-name">{{account_name}}</span></div>
</body>
</html>
