<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(160deg, #1a0533 0%, #0d1117 40%, #0a192f 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .icon { font-size: 64px; margin-bottom: 32px; }
    .tip-badge {
      display: inline-block;
      background: linear-gradient(135deg, {{accent_color}}33, #FF6B6B33);
      color: {{accent_color}}; font-size: 28px; font-weight: 700;
      padding: 10px 28px; border-radius: 50px; margin-bottom: 36px;
      border: 1px solid {{accent_color}}44;
    }
    .headline {
      font-size: 72px; font-weight: 800; color: #FFFFFF; text-align: center;
      line-height: 1.3; word-break: keep-all; margin-bottom: 36px;
    }
    .tip-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 40px 44px;
      width: 100%; max-width: 840px; border-left: 4px solid {{accent_color}};
      backdrop-filter: blur(10px);
    }
    .tip-text {
      font-size: 38px; font-weight: 400; color: rgba(255,255,255,0.6);
      line-height: 1.7; word-break: keep-all;
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 80px;
      font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="icon">{{badge_text}}</div>
    <div class="tip-badge">TIP</div>
    <h2 class="headline">{{headline}}</h2>
    <div class="tip-card"><p class="tip-text">{{body}}</p></div>
  </div>
</body>
</html>
