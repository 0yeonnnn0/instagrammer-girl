<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(160deg, #1a0533 0%, #0d1117 40%, #0a192f 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .content {
      display: flex; flex-direction: column; align-items: center;
      padding: 300px 80px 450px; width: 100%; height: 100%; justify-content: center;
    }
    .label {
      font-size: 32px; font-weight: 600; color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em; margin-bottom: 40px; text-transform: uppercase;
    }
    .stat-number {
      font-size: 200px; font-weight: 900; line-height: 1; letter-spacing: -0.05em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, {{accent_color}}, #FF6B6B);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-unit {
      font-size: 52px; font-weight: 700; color: {{accent_color}}; opacity: 0.6;
      margin-bottom: 44px;
    }
    .divider {
      width: 80px; height: 4px; margin-bottom: 40px;
      background: linear-gradient(90deg, {{accent_color}}, #FF6B6B); border-radius: 2px;
    }
    .body-text {
      font-size: 40px; font-weight: 400; color: rgba(255,255,255,0.5);
      text-align: center; line-height: 1.7; word-break: keep-all; max-width: 760px;
    }
    .glow {
      position: absolute; width: 500px; height: 500px; border-radius: 50%;
      filter: blur(150px); opacity: 0.12; background: {{accent_color}};
      top: 40%; left: 50%; transform: translate(-50%, -50%);
    }
    .scene-indicator {
      position: absolute; top: 280px; right: 80px;
      font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="scene-indicator">{{slide_number}} / {{total_slides}}</div>
  <div class="content">
    <div class="label">{{headline}}</div>
    <div class="stat-number">{{emphasis}}</div>
    <div class="stat-unit">{{subtext}}</div>
    <div class="divider"></div>
    <p class="body-text">{{body}}</p>
  </div>
</body>
</html>
